<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskHub · 全部任务</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='10' height='10' rx='2' fill='%230ea5e9'/%3E%3Crect x='18' y='4' width='10' height='10' rx='2' fill='%23334155'/%3E%3Crect x='4' y='18' width='10' height='10' rx='2' fill='%23334155'/%3E%3Crect x='18' y='18' width='10' height='10' rx='2' fill='%238b5cf6'/%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--scroll-track); }
  ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 4px; }
  :root { --accent: #6366f1; }
  :root[data-theme="dark"] {
    --bg: #09090b; --bg-card: #18181b; --bg-hover: #27272a;
    --border: #27272a; --border-soft: #3f3f46;
    --text: #fafafa; --text-sub: #d4d4d8; --text-mute: #a1a1aa; --text-dim: #71717a;
    --chip: #27272a; --input-bg: #101012;
    --scroll-track: #18181b; --scroll-thumb: #3f3f46;
    --st-queued-bg: rgba(113,113,122,.25); --st-queued-fg: #d4d4d8; --st-queued-bd: rgba(113,113,122,.4);
    --st-waiting-bg: rgba(251,191,36,.12); --st-waiting-fg: #fcd34d; --st-waiting-bd: rgba(251,191,36,.3);
    --st-running-bg: rgba(56,189,248,.15); --st-running-fg: #7dd3fc; --st-running-bd: rgba(56,189,248,.35);
    --st-done-bg: rgba(52,211,153,.15); --st-done-fg: #6ee7b7; --st-done-bd: rgba(52,211,153,.35);
    --st-failed-bg: rgba(244,63,94,.15); --st-failed-fg: #fda4af; --st-failed-bd: rgba(244,63,94,.35);
    --st-timeout-bg: rgba(251,191,36,.15); --st-timeout-fg: #fcd34d; --st-timeout-bd: rgba(251,191,36,.35);
    --st-cancel-bg: rgba(113,113,122,.15); --st-cancel-fg: #a1a1aa; --st-cancel-bd: rgba(113,113,122,.3);
  }
  :root[data-theme="light"] {
    --bg: #f4f4f5; --bg-card: #ffffff; --bg-hover: #f4f4f5;
    --border: #e4e4e7; --border-soft: #d4d4d8;
    --text: #18181b; --text-sub: #3f3f46; --text-mute: #71717a; --text-dim: #a1a1aa;
    --chip: #f4f4f5; --input-bg: #fafafa;
    --scroll-track: #f4f4f5; --scroll-thumb: #d4d4d8;
    --st-queued-bg: rgba(113,113,122,.12); --st-queued-fg: #52525b; --st-queued-bd: rgba(113,113,122,.35);
    --st-waiting-bg: rgba(217,119,6,.1); --st-waiting-fg: #b45309; --st-waiting-bd: rgba(217,119,6,.3);
    --st-running-bg: rgba(14,165,233,.12); --st-running-fg: #0369a1; --st-running-bd: rgba(14,165,233,.4);
    --st-done-bg: rgba(5,150,105,.12); --st-done-fg: #047857; --st-done-bd: rgba(5,150,105,.4);
    --st-failed-bg: rgba(225,29,72,.1); --st-failed-fg: #be123c; --st-failed-bd: rgba(225,29,72,.35);
    --st-timeout-bg: rgba(217,119,6,.12); --st-timeout-fg: #b45309; --st-timeout-bd: rgba(217,119,6,.4);
    --st-cancel-bg: rgba(113,113,122,.12); --st-cancel-fg: #71717a; --st-cancel-bd: rgba(113,113,122,.3);
  }
  .bg-base { background-color: var(--bg); }
  .bg-card { background-color: var(--bg-card); }
  .bg-hover:hover { background-color: var(--bg-hover); }
  .border-card { border-color: var(--border); }
  .text-main { color: var(--text); }
  .text-sub { color: var(--text-sub); }
  .text-mute { color: var(--text-mute); }
  .text-dim { color: var(--text-dim); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .st { display: inline-flex; padding: 1px 8px; border-radius: 6px; font-size: 12px; border: 1px solid; }
  .st-queued { background: var(--st-queued-bg); color: var(--st-queued-fg); border-color: var(--st-queued-bd); }
  .st-waiting { background: var(--st-waiting-bg); color: var(--st-waiting-fg); border-color: var(--st-waiting-bd); }
  .st-running { background: var(--st-running-bg); color: var(--st-running-fg); border-color: var(--st-running-bd); }
  .st-done { background: var(--st-done-bg); color: var(--st-done-fg); border-color: var(--st-done-bd); }
  .st-failed { background: var(--st-failed-bg); color: var(--st-failed-fg); border-color: var(--st-failed-bd); }
  .st-timeout { background: var(--st-timeout-bg); color: var(--st-timeout-fg); border-color: var(--st-timeout-bd); }
  .st-cancelled { background: var(--st-cancel-bg); color: var(--st-cancel-fg); border-color: var(--st-cancel-bd); }
  /* 输入框 */
  .input-field {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-sub);
    font-size: 12px;
    border-radius: 8px;
    padding: 6px 12px;
    outline: none;
    width: 100%;
    transition: border-color .15s, box-shadow .15s, background-color .15s;
  }
  .input-field:hover { border-color: var(--border-soft); background-color: var(--bg-hover); }
  .input-field:focus { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 20%, transparent); }
  .input-field::placeholder { color: var(--text-dim); }

  /* 按钮 */
  .btn { font-size: 12px; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border); color: var(--text-mute); background: var(--bg-card); cursor: pointer; transition: all .15s; }
  .btn:hover { color: var(--text-main); background: var(--bg-hover); border-color: var(--border-soft); }
  .btn-primary { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
  .btn-primary:hover { background: color-mix(in srgb, var(--accent) 25%, transparent); color: var(--accent); }

  /* 自定义下拉（shadcn Select 风格） */
  .select-wrap { position: relative; display: inline-block; }
  .select-field {
    display: inline-flex; align-items: center; gap: 7px;
    background-color: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-sub);
    border-radius: 8px;
    font-size: 12px;
    padding: 6px 12px;
    cursor: pointer;
    outline: none;
    transition: border-color .15s, background-color .15s;
  }
  .select-field:hover { border-color: var(--border-soft); background-color: var(--bg-hover); }
  .select-field:focus, .select-field.open { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 20%, transparent); }
  .select-arrow { color: var(--text-dim); transition: transform .15s; }
  .select-field.open .select-arrow { transform: rotate(180deg); color: var(--accent); }
  .select-menu {
    position: absolute; top: calc(100% + 4px); left: 0; z-index: 50;
    min-width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
    box-shadow: 0 10px 30px rgba(0,0,0,.28), 0 0 0 1px color-mix(in srgb, var(--border) 60%, transparent);
  }
  .select-option {
    padding: 6px 12px; border-radius: 6px;
    font-size: 12px; color: var(--text-sub);
    cursor: pointer; white-space: nowrap;
    transition: background-color .1s;
  }
  .select-option:hover { background: var(--bg-hover); color: var(--text-main); }
  .select-option.selected { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .select-option.selected::after { content: '✓'; margin-left: 8px; }
</style>
</head>
<body class="bg-base text-sub min-h-screen">

<div class="max-w-7xl mx-auto px-6 py-6">

  <!-- Header -->
  <header class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-3">
      <a href="/ui/" class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:color-mix(in srgb, var(--accent) 15%, transparent); border:1px solid color-mix(in srgb, var(--accent) 30%, transparent)">
        <svg class="w-5 h-5" style="color:var(--accent)" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 5h16M4 12h16M4 19h10"/></svg>
      </a>
      <div>
        <h1 class="text-lg font-semibold text-main tracking-tight">全部任务</h1>
        <p class="text-xs text-dim">历史任务记录（SQLite 持久化）</p>
      </div>
    </div>
    <div class="flex items-center gap-2.5">
      <a href="/ui/stats.html" class="text-xs px-3 py-1.5 rounded-full bg-hover border border-card text-mute hover:text-main">统计</a>
      <a href="/ui/" class="text-xs px-3 py-1.5 rounded-full bg-hover border border-card text-mute hover:text-main">← 监控面板</a>
      <button id="btn-theme" class="w-9 h-9 rounded-full bg-hover border border-card flex items-center justify-center text-mute hover:text-main" title="切换主题">
        <span id="icon-sun" class="hidden"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path stroke-linecap="round" d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg></span>
        <span id="icon-moon" class="hidden"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span>
      </button>
    </div>
  </header>

  <!-- Filters -->
  <div class="rounded-2xl bg-card border border-card p-4 mb-5">
    <div class="flex flex-wrap items-end gap-3">
      <div>
        <div class="text-[11px] text-dim mb-1">任务类型</div>
        <div id="f-type-wrap"></div>
      </div>
      <div>
        <div class="text-[11px] text-dim mb-1">状态</div>
        <div id="f-status-wrap"></div>
      </div>
      <div class="flex-1 min-w-[200px]">
        <div class="text-[11px] text-dim mb-1">关键词（任务ID / 错误信息）</div>
        <input id="f-keyword" type="text" placeholder="搜索…" class="input-field">
      </div>
      <div>
        <div class="text-[11px] text-dim mb-1">&nbsp;</div>
        <button id="btn-query" class="btn btn-primary">查询</button>
      </div>
      <div>
        <div class="text-[11px] text-dim mb-1">&nbsp;</div>
        <button id="btn-reset" class="btn">重置</button>
      </div>
    </div>
  </div>

  <!-- Table -->
  <div class="rounded-2xl bg-card border border-card">
    <div class="flex items-center justify-between px-5 py-3 border-b border-card">
      <span id="total-label" class="text-xs text-dim">共 0 条</span>
      <div class="flex items-center gap-2 text-xs text-mute">
        每页 <div id="f-size-wrap"></div>
      </div>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="text-left text-[11px] uppercase tracking-wider text-dim border-b border-card">
            <th class="px-5 py-2.5">任务 ID</th>
            <th class="px-3 py-2.5">类型</th>
            <th class="px-3 py-2.5 text-right">字数</th>
            <th class="px-3 py-2.5">状态</th>
            <th class="px-3 py-2.5 text-right">排队</th>
            <th class="px-3 py-2.5 text-right">运行</th>
            <th class="px-3 py-2.5">创建时间</th>
            <th class="px-3 py-2.5">完成时间</th>
            <th class="px-5 py-2.5">错误</th>
          </tr>
        </thead>
        <tbody id="tasks-body">
          <tr><td colspan="9" class="px-5 py-10 text-center text-dim">加载中…</td></tr>
        </tbody>
      </table>
    </div>
    <div class="flex items-center justify-between px-5 py-3 border-t border-card">
      <span id="page-label" class="text-xs text-dim">第 1 / 1 页</span>
      <div class="flex items-center gap-2">
        <button id="btn-prev" class="btn">← 上一页</button>
        <button id="btn-next" class="btn">下一页 →</button>
      </div>
    </div>
  </div>

</div>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (n, d = 1) => (n === null || n === undefined || isNaN(n)) ? '–' : Number(n).toFixed(d);
const STATUS_LABEL = { queued:'排队中', waiting:'等待中', running:'运行中', done:'完成', failed:'失败', timeout:'超时', cancelled:'已取消' };
const TYPE_LABEL = { tts: '语音', comfyui: '绘图' };
const TYPE_COLORS = {
  tts:     { fg: '#0ea5e9', bg: 'rgba(14,165,233,.12)', bd: 'rgba(14,165,233,.35)' },
  comfyui: { fg: '#8b5cf6', bg: 'rgba(139,92,246,.12)', bd: 'rgba(139,92,246,.35)' },
};

// 主题
function getTheme() {
  const s = localStorage.getItem('ms-theme');
  if (s) return s;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
}
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  localStorage.setItem('ms-theme', t);
  $('icon-sun').classList.toggle('hidden', t !== 'light');
  $('icon-moon').classList.toggle('hidden', t !== 'dark');
}
$('btn-theme').onclick = () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
applyTheme(getTheme());

const state = { page: 1, pageSize: 20, taskType: '', status: '', keyword: '' };

// ---------- 通用自定义下拉（shadcn Select 风格） ----------
function createSelect(wrapEl, opts, initial, onChange) {
  wrapEl.classList.add('select-wrap');
  wrapEl.innerHTML = `
    <button class="select-field" type="button">
      <span class="sel-label"></span>
      <svg class="select-arrow" width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="select-menu hidden"></div>`;
  const btn = wrapEl.querySelector('.select-field');
  const menu = wrapEl.querySelector('.select-menu');
  const label = wrapEl.querySelector('.sel-label');
  let value = initial;
  function renderMenu() {
    menu.innerHTML = '';
    opts.forEach((o) => {
      const d = document.createElement('div');
      d.className = 'select-option' + (o.value === value ? ' selected' : '');
      d.textContent = o.label;
      d.onclick = () => { setValue(o.value); close(); onChange(o.value); };
      menu.appendChild(d);
    });
  }
  function setValue(v) {
    value = v;
    const cur = opts.find((o) => o.value === v);
    label.textContent = cur ? cur.label : '';
    renderMenu();
  }
  function close() { menu.classList.add('hidden'); btn.classList.remove('open'); }
  btn.onclick = (e) => {
    e.stopPropagation();
    const hidden = menu.classList.contains('hidden');
    close();
    if (hidden) { renderMenu(); menu.classList.remove('hidden'); btn.classList.add('open'); }
  };
  document.addEventListener('click', (e) => { if (!wrapEl.contains(e.target)) close(); });
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  setValue(initial);
  return { getValue: () => value, setValue };
}
const typeSelect = createSelect($('f-type-wrap'), [
  { value: '', label: '全部' }, { value: 'tts', label: '语音' }, { value: 'comfyui', label: '绘图' },
], '', () => {});
const statusSelect = createSelect($('f-status-wrap'), [
  { value: '', label: '全部' }, { value: 'queued', label: '排队中' }, { value: 'waiting', label: '等待中' },
  { value: 'running', label: '运行中' }, { value: 'done', label: '完成' }, { value: 'failed', label: '失败' },
  { value: 'timeout', label: '超时' }, { value: 'cancelled', label: '已取消' },
], '', () => {});

function fmtTime(ts) {
  if (!ts) return '–';
  const d = new Date(ts * 1000);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
}

async function load() {
  const q = new URLSearchParams({
    page: state.page, page_size: state.pageSize,
    task_type: state.taskType, status: state.status, keyword: state.keyword,
  });
  $('tasks-body').innerHTML = '<tr><td colspan="8" class="px-5 py-10 text-center text-dim">加载中…</td></tr>';
  try {
    const r = await fetch(`/tasks?${q}`);
    const d = await r.json();
    $('total-label').textContent = `共 ${d.total} 条`;
    $('page-label').textContent = `第 ${d.page} / ${d.pages} 页`;
    $('btn-prev').disabled = d.page <= 1;
    $('btn-next').disabled = d.page >= d.pages;
    const body = $('tasks-body');
    if (!d.tasks.length) {
      body.innerHTML = '<tr><td colspan="9" class="px-5 py-10 text-center text-dim">没有符合条件的任务</td></tr>';
      return;
    }
    body.innerHTML = '';
    d.tasks.forEach((t) => {
      const tc = TYPE_COLORS[t.task_type] || { fg: 'var(--accent)', bg: 'color-mix(in srgb, var(--accent) 12%, transparent)', bd: 'color-mix(in srgb, var(--accent) 25%, transparent)' };
      const tr = document.createElement('tr');
      tr.className = 'border-b border-card bg-hover';
      tr.innerHTML = `
        <td class="px-5 py-2.5 mono text-xs text-mute">${t.task_id}</td>
        <td class="px-3 py-2.5"><span class="text-xs px-2 py-0.5 rounded-md" style="background:${tc.bg}; color:${tc.fg}; border:1px solid ${tc.bd}">${TYPE_LABEL[t.task_type] || t.task_type}</span></td>
        <td class="px-3 py-2.5 text-right mono text-xs text-mute">${t.task_type === 'tts' ? (t.text_len || '–') + '字' : '–'}</td>
        <td class="px-3 py-2.5"><span class="st st-${t.status}">${STATUS_LABEL[t.status] || t.status}</span></td>
        <td class="px-3 py-2.5 text-right mono text-xs text-mute">${fmt(t.queue_seconds)}s</td>
        <td class="px-3 py-2.5 text-right mono text-xs text-mute">${fmt(t.run_seconds)}s</td>
        <td class="px-3 py-2.5 text-xs text-mute mono">${fmtTime(t.created_at)}</td>
        <td class="px-3 py-2.5 text-xs text-mute mono">${fmtTime(t.finished_at)}</td>
        <td class="px-5 py-2.5 text-xs text-dim mono" title="${String(t.error || '').replace(/"/g, '&quot;')}">${String(t.error || '').slice(0, 40)}</td>`;
      body.appendChild(tr);
    });
  } catch (e) {
    $('tasks-body').innerHTML = `<tr><td colspan="8" class="px-5 py-10 text-center text-dim">加载失败：${e}</td></tr>`;
  }
}

$('btn-query').onclick = () => {
  state.page = 1;
  state.taskType = typeSelect.getValue();
  state.status = statusSelect.getValue();
  state.keyword = $('f-keyword').value.trim();
  load();
};
$('btn-reset').onclick = () => {
  typeSelect.setValue(''); statusSelect.setValue(''); $('f-keyword').value = '';
  state.page = 1; state.taskType = ''; state.status = ''; state.keyword = '';
  load();
};
const sizeSelect = createSelect($('f-size-wrap'), [10, 20, 50, 100].map((v) => ({ value: String(v), label: v + ' 条' })), '20', (v) => { state.pageSize = parseInt(v, 10) || 20; state.page = 1; load(); });
$('btn-prev').onclick = () => { if (state.page > 1) { state.page--; load(); } };
$('btn-next').onclick = () => { state.page++; load(); };
$('f-keyword').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btn-query').onclick(); });

load();
</script>
</body>
</html>
