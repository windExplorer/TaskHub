# TaskHub 配置
# 环境变量（MIDDLE_*）优先于本文件

server:
  host: 0.0.0.0
  port: 9000
  max_concurrent: 1          # 全局最大并发任务数（收紧避免 TTS/ComfyUI 同时挤爆显存）
  queue_wait: 120             # 入队等待超时（秒），超时回 429；0 = 不限制（由客户端自行掐超时）
  infer_timeout: 120          # 单次推理超时（秒），超时回 504；0 = 不限制（由客户端自行掐超时）
  db_path: ./middle-station.db
  log_max_lines: 100
  frontend_dir: ./frontend

tts:
  base_url: http://127.0.0.1:50002   # 真实 CosyVoice 后端（插件配置指向本中转站）
  sample_rate: 24000                 # 兜底采样率，启动探测到后端真实值后自动覆盖
  voices_dir: null                   # 服务端参考音频目录（用于构建 文件名->文本 映射）
  voices_json: null                  # 文件名 -> prompt_text 映射文件（json）
  # voices:                          # 内联映射（优先级最高）
  #   xiaoyu.wav: 你好，我是小宇。

comfyui:
  base_url: http://127.0.0.1:8188    # 真实 ComfyUI
  serialize_concurrent: 1            # 同一时刻只放行 1 个 /prompt（单飞）
  watch_interval: 2                  # 轮询真实 /history 间隔（秒）
  watch_timeout: 900                 # 出图跟踪硬超时（秒），到时标失败并释放单飞槽位；0 = 不限时（不推荐）
  watch_lost_grace: 30               # 提交后 N 秒起核对真实 /queue，判断 prompt 是否已被上游丢弃
  watch_lost_confirm: 2              # 连续 N 次「既不在 /queue 也不在 /history」才判丢失（防误判）
  progress_stream: true              # 订阅真实 ComfyUI /ws：真实进度（节点/步数）+ 卡死判据
  client_id: null                    # 提交给 ComfyUI 的 client_id，null = 自动生成 taskhub-xxxxxxxx

monitoring:
  gpu_threshold: 0.8                 # GPU 算力占用率 >80% 时自动降并发
  vram_threshold: 0.25               # 可用显存比例 <25% 时自动降并发（防 OOM）
  vram_min_free_gb: 1.0              # 可用显存 <1GB 时自动降并发（防 OOM）
  interval_seconds: 2                # 采样间隔（秒）

inspector:                           # 上游自检巡检（异常只告警；唯一主动处置是「上游丢弃 prompt」）
  enabled: true
  interval: 10                       # 巡检周期（秒）
  slow_factor: 3.0                   # 耗时 > 同类成功任务 P95 × 此系数 → 标红告警
  slow_min_seconds: 60               # 基线阈值下限（秒），历史样本不足时兜底
  stall_seconds: 240                 # 上游在跑但这么久没有任何进度事件 → 疑似卡住（告警）
  history_hours: 24                  # 计算耗时基线用的历史窗口
  baseline_ttl: 300                  # 耗时基线缓存有效期（秒）
  system_stats_every: 3              # 每 N 轮巡检查一次上游 /system_stats（显存水位）
