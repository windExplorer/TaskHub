server:
  host: 0.0.0.0
  port: 9000
  max_concurrent: 1
  queue_wait: 30
  infer_timeout: 110
  db_path: ./middle-station.db
  log_max_lines: 100
  frontend_dir: ./webui/dist
  vram_cleanup_on_type_switch: true
  tasks_enabled:
    tts: true
    comfyui: true
    nsfw: true
tts:
  base_url: http://127.0.0.1:50002
  sample_rate: 24000
  voices_dir: null
  voices_json: null
  voices: {}
comfyui:
  base_url: http://127.0.0.1:8188
  serialize_concurrent: 1
  watch_interval: 2.0
  watch_timeout: 900.0
  watch_lost_grace: 30.0
  watch_lost_confirm: 2
  progress_stream: true
  client_id: null
  free_vram_on_type_switch: true
monitoring:
  gpu_threshold: 0.8
  vram_threshold: 0.25
  vram_min_free_gb: 1.0
  interval_seconds: 2.0
inspector:
  enabled: true
  interval: 10.0
  slow_factor: 3.0
  slow_min_seconds: 60.0
  stall_seconds: 240.0
  history_hours: 24.0
  baseline_ttl: 300.0
  system_stats_every: 3
nsfw:
  enabled: true
  base_url: http://127.0.0.1:8890
  token: ''
  mode: label
  timeout: 25.0
  queue_wait: 60.0
  wait_seconds: 15.0
  output_dir: null
  prewarm: true
services:
  enabled: true
  check_interval: 10
  start_grace: 120
  fail_threshold: 3
  health_timeout: 5
  restart_window: 300
  restart_cooldown: 60
  max_restart_attempts: 3
  items:
  - name: taskhub
    label: TaskHub（本服务）
    enabled: true
    managed: false
    self: true
    autostart: false
    auto_restart: false
    health_url: http://127.0.0.1:9000/health
    port: 9000
    log: logs/services/taskhub.log
  - name: comfyui
    label: ComfyUI
    enabled: true
    managed: true
    autostart: true
    auto_restart: false
    cwd: D:/AI/ComfyUI-aki/ComfyUI-aki-v3/ComfyUI
    command:
    - D:/AI/ComfyUI-aki/ComfyUI-aki-v3/python/python.exe
    - -s
    - D:/AI/ComfyUI-aki/ComfyUI-aki-v3/ComfyUI/main.py
    - --windows-standalone-build
    - --disable-auto-launch
    - --preview-method
    - auto
    - --fast
    - fp16_accumulation
    - --cuda-malloc
    - --enable-cors-header
    - --listen
    - 0.0.0.0
    - --enable-compress-response-body
    health_url: http://127.0.0.1:8188/system_stats
    port: 8188
    process_match:
    - ComfyUI_TE模式启动器.exe
    log: logs/services/comfyui.log
  - name: tts-serve
    label: TTS-Serve（Qwen3 / CosyVoice）
    enabled: true
    managed: true
    autostart: true
    auto_restart: false
    cwd: D:/AI/TTS_SERVE/tts_serve
    command:
    - .venv-qwen3/Scripts/python.exe
    - -m
    - app.serve
    health_url: http://127.0.0.1:50002/
    port: 50002
    process_match:
    - -m app.serve
    log: logs/services/tts-serve.log
  - name: nsfw-check
    label: NSFW-Check
    enabled: true
    managed: true
    autostart: true
    auto_restart: false
    cwd: D:/AI/nsfw-check
    command:
    - .venv/Scripts/python.exe
    - run.py
    env:
      DEVICE: cuda
      PRECISION: bf16
    health_url: http://127.0.0.1:8890/healthz
    port: 8890
    log: logs/services/nsfw-check.log
alerts:
  enabled: false
  cooldown_seconds: 60
  events:
    down: true
    up: false
    restart_failed: true
  channels:
    gotify:
      enabled: false
      url: ''
      token: ''
      priority: 8
    email:
      enabled: false
      host: ''
      port: 465
      ssl: true
      starttls: false
      user: ''
      password: ''
      from_addr: ''
      to_addrs: []
